# ============================================================
# Redis — ADZKIA SMART. MURNI CACHE.
#
# TIDAK ADA PERSISTENSI, dan itu keputusan yang disengaja: tidak ada AOF,
# tidak ada snapshot RDB. Seluruh isinya boleh hilang kapan saja tanpa satu
# pun data sekolah ikut hilang, karena kebenarannya tetap tinggal di
# PostgreSQL. Yang disimpan di sini hanya sesi login (cache 60 detik, bisa
# dibaca ulang dari basis data), metadata paket, dan pencacah pembatas laju.
#
# KALAU KELAK REDIS DIPAKAI MENYIMPAN SESUATU YANG TIDAK ADA SALINANNYA DI
# POSTGRESQL — antrean pekerjaan, misalnya — SIFAT INI HARUS DITINJAU ULANG,
# dan berkas ini adalah tempat pertama yang harus diubah.
# ============================================================

bind 0.0.0.0
protected-mode yes
port 6379

# Sandi dibaca dari berkas rahasia, tidak ditulis di sini.
# requirepass dipasang lewat argumen `command:` docker-compose.

save ""
appendonly no

# Saat penuh, BUANG entri terlama — jangan menolak penulisan baru. Arah ini
# penting: cache yang menolak menulis akan membuat setiap permintaan jatuh ke
# PostgreSQL justru pada saat beban sedang paling berat.
maxmemory 512mb
maxmemory-policy allkeys-lru

# Klien yang menggantung tidak boleh menahan slot selamanya.
timeout 300
tcp-keepalive 60

# Perintah yang tidak punya alasan dipakai aplikasi ini, dan yang salah ketik
# satu kali bisa mengosongkan seluruh cache di tengah ujian.
rename-command FLUSHALL ""
rename-command FLUSHDB ""
rename-command KEYS ""
