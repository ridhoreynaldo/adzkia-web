; ============================================================
; PgBouncer — ADZKIA SMART
;
; APA YANG SEBENARNYA DILAKUKANNYA DI SINI, supaya angkanya tidak diubah
; berdasarkan tebakan kelak.
;
; PgBouncer TIDAK membuat PostgreSQL lebih cepat. Ia membuat PostgreSQL
; TIDAK PERLU tahu ada berapa banyak peserta. Tiap koneksi PostgreSQL adalah
; satu proses OS dengan memorinya sendiri; 500 koneksi menganggur memakan
; ratusan megabyte dan memperlambat setiap pengambilan kunci di dalamnya,
; sementara yang benar-benar mengerjakan sesuatu pada satu saat cuma sebanyak
; inti prosesornya. PgBouncer berdiri di tengah: ribuan peserta boleh menempel
; padanya, tetapi PostgreSQL hanya pernah melihat beberapa puluh koneksi.
;
; Menaikkan `default_pool_size` BUKAN cara mempercepat aplikasi ini. Kalau
; antrean menumpuk, yang salah hampir selalu query-nya atau indeksnya, dan
; menambah koneksi hanya memindahkan antrean dari PgBouncer ke PostgreSQL —
; tempat antrean jauh lebih mahal.
; ============================================================

[databases]
; Kata sandinya TIDAK ditulis di sini. PgBouncer meneruskan kredensial yang
; dipakai aplikasi, dan mencocokkannya dengan `userlist.txt`.
adzkia = host=db port=5432 dbname=adzkia

[pgbouncer]

listen_addr = 0.0.0.0
listen_port = 6432

auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

; ------------------------------------------------------------
; MODE POOLING — keputusan terpenting di berkas ini
; ------------------------------------------------------------
;
; `transaction` berarti koneksi PostgreSQL dikembalikan ke kumpulan begitu
; TRANSAKSI selesai, bukan saat aplikasi memutus sambungan. Itulah yang membuat
; beberapa puluh koneksi sanggup melayani ribuan peserta: denyut nadi memegang
; koneksi selama satu-dua milidetik, lalu melepasnya.
;
; HARGANYA: TIDAK ADA KEADAAN YANG BOLEH MENUMPANG DI ANTARA TRANSAKSI. Empat
; hal berikut akan rusak diam-diam — jalan pada pengujian, gagal saat ramai —
; dan ketiganya sudah ditangani di aplikasi ini:
;
;   1. `SET` di luar transaksi. Zona waktu dulu dikirim sebagai parameter
;      pembuka `options=-c timezone=...`; PgBouncer menolak parameter pembuka
;      yang tidak dikenalnya. Karena itu aplikasi membaca `PGBOUNCER=1` dan
;      tidak mengirimnya lagi — zonanya dipasang di SISI SERVER:
;
;          ALTER DATABASE adzkia SET timezone = 'Asia/Jakarta';
;
;      Lihat `LEWAT_PGBOUNCER` di `src/lib/db.ts`.
;
;   2. Prepared statement BERNAMA. `node-postgres` memakai pernyataan TANPA
;      nama secara bawaan, jadi aman. Yang TIDAK aman adalah `.prepare()` milik
;      Drizzle — jangan dipakai. `max_prepared_statements` di bawah memberi
;      jaring pengaman kalau kelak ada yang memakainya tanpa sadar.
;
;   3. `LISTEN` / `NOTIFY` — tidak dipakai aplikasi ini.
;
;   4. Kunci penasihat (`pg_advisory_lock`) yang dipegang lintas transaksi —
;      tidak dipakai. Penguncian di aplikasi ini memakai `SELECT … FOR UPDATE`
;      DI DALAM satu pernyataan, yang memang selesai bersama transaksinya.
pool_mode = transaction

; ------------------------------------------------------------
; UKURAN — dari mana angkanya
; ------------------------------------------------------------
;
; Beban puncaknya (lihat docs/production-architecture.md):
;
;     10.000 peserta × 1 denyut / 5 detik   = 2.000 permintaan/detik
;     + sinkron timer dan autosave           ≈ 3.000 permintaan/detik
;     ≈ 5.000 query/detik
;
; Query pada jalur itu semuanya pencarian lewat indeks unik, yang pada basis
; data sebesar ini selesai di bawah 5 milidetik. Satu koneksi yang sibuk penuh
; karena itu sanggup ±200 query/detik, sehingga 5.000 query/detik memerlukan
; SEKITAR 25 koneksi yang benar-benar bekerja.
;
; 40 memberi kelonggaran 60% untuk query yang lebih lambat dari dugaan, dan
; masih jauh di bawah jumlah yang membuat PostgreSQL menghabiskan waktunya
; mengurus koneksi alih-alih menjawab. ANGKA INI HARUS DIUJI BEBAN, bukan
; dipercaya — sampai saat itu ia perkiraan yang beralasan, bukan kesimpulan.
default_pool_size = 40

; Cadangan yang baru dipakai kalau kumpulan utama habis DAN sudah ada yang
; menunggu selama `reserve_pool_timeout`. Gunanya bukan menambah kapasitas,
; melainkan mencegah satu ledakan sesaat berubah menjadi galat.
reserve_pool_size = 10
reserve_pool_timeout = 3

; Batas atas mutlak koneksi PostgreSQL dari seluruh kumpulan. Harus TETAP di
; bawah `max_connections` PostgreSQL (200), menyisakan ruang untuk psql
; pengelola, pencadangan, dan pemantauan — kalau tidak, orang yang memperbaiki
; keadaan justru tidak bisa masuk saat keadaannya paling buruk.
max_db_connections = 90

; Berapa banyak peserta yang boleh MENEMPEL pada PgBouncer. Ini murah —
; koneksi klien hanyalah soket, bukan proses — jadi angkanya jauh lebih besar
; daripada jumlah koneksi PostgreSQL. Inilah inti manfaatnya.
max_client_conn = 5000

; Jaring pengaman untuk butir (2) di atas. Bukan izin memakai prepared
; statement bernama — hanya supaya satu pemakaian yang tidak sengaja tidak
; langsung menjatuhkan ruang ujian.
max_prepared_statements = 200

; ------------------------------------------------------------
; BATAS WAKTU
; ------------------------------------------------------------
;
; MENGGANTUNG LEBIH BURUK DARIPADA GAGAL. Itu pelajaran yang sudah dibayar
; mahal aplikasi ini: satu permintaan denyut yang menggantung menghentikan
; SELURUH denyut peserta itu, dan server membaca halaman yang diam sebagai
; peserta yang pergi — lalu menggugurkannya. Batas waktu di bawah memastikan
; kegagalan datang CEPAT dan BERISIK, sehingga klien bisa mencoba lagi.

; Lama menunggu koneksi dari kumpulan sebelum menyerah. Denyutnya sendiri
; menyerah pada 8 detik (BATAS_DENYUT_MS), jadi menunggu lebih lama daripada
; itu tidak menolong siapa pun.
query_wait_timeout = 10

; Query yang berjalan lebih lama daripada ini dibatalkan. Tidak ada query di
; jalur ujian yang pantas melewati 30 detik; yang sepanjang itu pasti macet.
; Ekspor dan rekap pengelola yang memang lama memakai koneksi LANGSUNG ke
; PostgreSQL (port 5432), bukan lewat PgBouncer — lihat catatan di bawah.
query_timeout = 30

; Koneksi server yang menganggur lebih lama daripada ini ditutup, supaya jam
; sepi tidak menahan puluhan proses PostgreSQL tanpa guna.
server_idle_timeout = 60

; Klien yang diam di TENGAH transaksi adalah tanda kerusakan, bukan kesabaran:
; ia menahan koneksi server sekaligus kuncinya.
idle_transaction_timeout = 30

; ------------------------------------------------------------
; PENGELOLAAN & CATATAN
; ------------------------------------------------------------

; Hanya peran ini yang boleh membuka konsol `SHOW POOLS` / `SHOW STATS`.
admin_users = adzkia
stats_users = adzkia

; Satu baris per koneksi terlalu berisik pada 5.000 peserta; ringkasan tiap
; menit sudah cukup untuk melihat kumpulan yang penuh.
log_connections = 0
log_disconnections = 0
stats_period = 60

; Waktu server basis data, bukan waktu VPS.
;
; CATATAN UNTUK PEKERJAAN PENGELOLA YANG BERAT — ekspor nilai, rekap seluruh
; paket, penghitungan ulang IRT. Pekerjaan itu memegang koneksi selama
; puluhan detik dan akan menahan satu slot kumpulan yang seharusnya melayani
; ribuan denyut. Jalankan lewat koneksi LANGSUNG ke PostgreSQL (port 5432,
; bukan 6432), yang di `docker-compose.prod.yml` memang masih terbuka untuk
; 127.0.0.1 saja.
