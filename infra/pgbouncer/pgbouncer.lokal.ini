; ============================================================
; PgBouncer — PENGEMBANGAN DI LAPTOP
;
; Kembaran `pgbouncer.ini` (produksi) dengan TIGA perbedaan, dan hanya tiga:
;
;   1. menyambung ke PostgreSQL PORTABEL di 127.0.0.1:5432 (folder `.alat`),
;      bukan ke host `db` milik Docker;
;   2. ukurannya kecil — satu laptop, bukan 10.000 peserta;
;   3. `log_connections` dinyalakan, supaya terlihat ia benar-benar melayani.
;
; SELURUH SIFAT YANG MENENTUKAN BENAR-SALAHNYA APLIKASI TETAP SAMA — terutama
; `pool_mode = transaction`. Justru itulah gunanya menjalankannya di laptop:
; yang ingin dibuktikan bukan kapasitasnya, melainkan bahwa aplikasi ini
; BERJALAN BENAR di balik pooling transaksi. Kalau ada `SET` yang menumpang di
; antara transaksi, atau prepared statement bernama yang lolos, ia akan gagal
; di sini juga — dengan galat yang sama persis seperti di produksi.
;
; Dijalankan oleh `npm run pgbouncer:lokal`; lihat scripts/pgbouncer-lokal.ps1.
; ============================================================

[databases]
adzkia = host=127.0.0.1 port=5432 dbname=adzkia

[pgbouncer]

listen_addr = 127.0.0.1
listen_port = 6432

auth_type = scram-sha-256
auth_file = ./userlist.lokal.txt

; SAMA DENGAN PRODUKSI. Jangan diganti menjadi `session` supaya "jalan dulu" —
; itu justru menghapus satu-satunya alasan menjalankannya di laptop.
pool_mode = transaction

; Kecil dengan sengaja: satu laptop, beberapa tab peramban. Yang diuji di sini
; perilaku, bukan kapasitas.
default_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 3
max_db_connections = 20
max_client_conn = 200

; Jaring pengaman yang sama dengan produksi: `.prepare()` milik Drizzle akan
; membuat prepared statement BERNAMA, yang tidak aman di mode transaksi.
max_prepared_statements = 200

query_wait_timeout = 10
query_timeout = 30
server_idle_timeout = 60
idle_transaction_timeout = 30

admin_users = adzkia
stats_users = adzkia

; Dinyalakan — di laptop justru inilah buktinya bahwa aplikasi benar-benar
; lewat sini dan bukan menyambung langsung ke 5432.
log_connections = 1
log_disconnections = 1
stats_period = 60
