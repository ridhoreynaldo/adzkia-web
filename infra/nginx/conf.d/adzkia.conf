# ============================================================
# Nginx — pintarbersamaadzkia.com
#
# Tugasnya di sini ada empat, dan hanya empat: menutup TLS, menyajikan berkas
# statis tanpa membangunkan Node, menyebar permintaan ke beberapa proses
# Next.js, dan menolak banjir permintaan sebelum sampai ke aplikasi.
#
# YANG SENGAJA TIDAK DILAKUKANNYA: menyimpan cache halaman. Hampir seluruh
# halaman aplikasi ini bergantung pada siapa yang masuk, dan cache yang salah
# setel akan menyajikan ruang ujian milik peserta lain. Cache-nya ada di Redis,
# di sisi aplikasi, tempat identitas peserta ikut diperhitungkan.
# ============================================================

# ------------------------------------------------------------
# Kumpulan proses aplikasi
# ------------------------------------------------------------
#
# SATU proses Next.js tidak akan cukup. Node menjalankan JavaScript di satu
# utas; pada VPS 4 inti, tiga perempat mesinnya menganggur sementara satu inti
# menjadi leher botol. Jalankan satu proses per inti (sisakan satu untuk Nginx
# dan PostgreSQL), lalu daftarkan semuanya di sini.
#
# `least_conn`, bukan round-robin: permintaan aplikasi ini sangat berbeda
# lamanya — denyut selesai dalam milidetik, ekspor nilai memakan puluhan detik.
# Round-robin akan terus mengirim denyut ke proses yang sedang menyusun berkas
# Excel.
upstream adzkia_app {
    least_conn;
    server 127.0.0.1:3000 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3001 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:3002 max_fails=3 fail_timeout=10s;
    keepalive 64;
}

# ------------------------------------------------------------
# Zona pembatas laju
# ------------------------------------------------------------
#
# INI PAGAR TERLUAR, BUKAN PAGAR SATU-SATUNYA. Pembatas yang sesungguhnya ada
# di `src/lib/laju.ts`, yang tahu siapa penggunanya; yang di sini hanya tahu
# alamat IP. Bedanya penting: SATU SEKOLAH BISA TAMPIL SEBAGAI SATU ALAMAT IP.
# Ratusan peserta di balik satu NAT sekolah akan terlihat seperti satu klien
# yang mengamuk, dan pembatas per-IP yang ketat akan MENGGUGURKAN SATU RUANGAN
# PENUH SEKALIGUS.
#
# Karena itu angka di bawah longgar sekali dan hanya dimaksudkan menahan
# banjir yang benar-benar kasar.
limit_req_zone $binary_remote_addr zone=ujian:20m rate=100r/s;
limit_req_zone $binary_remote_addr zone=masuk:10m rate=2r/s;

server {
    listen 80;
    server_name pintarbersamaadzkia.com www.pintarbersamaadzkia.com;
    # Satu-satunya yang boleh dilayani lewat HTTP polos.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name pintarbersamaadzkia.com www.pintarbersamaadzkia.com;

    ssl_certificate     /etc/letsencrypt/live/pintarbersamaadzkia.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pintarbersamaadzkia.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # Peserta mengunggah foto; naskah soal .docx dan rekaman Listening jauh
    # lebih besar. 64 MB memberi ruang untuk rekaman terpanjang.
    client_max_body_size 64m;

    # Peramban ruang ujian TIDAK boleh menyimpan halaman soal di disk.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript
               application/xml image/svg+xml;
    gzip_min_length 1024;

    # --------------------------------------------------------
    # Berkas statis Next.js
    # --------------------------------------------------------
    #
    # Nama berkasnya memuat sidik jari isinya, jadi berkas yang sama tidak
    # pernah berubah — aman disimpan selamanya. Inilah yang membuat 10.000
    # peserta yang memuat ruang ujian pada menit yang sama tidak berubah
    # menjadi 10.000 permintaan ke Node.
    location /_next/static/ {
        alias /srv/adzkia/app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Gambar soal, rekaman, foto peserta — disajikan langsung dari disk.
    # `private` karena isi soal bukan milik umum, sekalipun alamatnya ditebak.
    location ~ ^/(soal|peserta|warung)/ {
        root /srv/adzkia/data/unggahan;
        expires 7d;
        add_header Cache-Control "private, max-age=604800";
        access_log off;
        try_files $uri @app;
    }

    # --------------------------------------------------------
    # Jalur ujian — rute terpanas
    # --------------------------------------------------------
    #
    # `burst=200 nodelay` membiarkan ledakan awal lewat utuh. Ledakan itu
    # NORMAL di sini: satu ruangan menekan Mulai pada detik yang sama.
    location ~ ^/api/(exam|language)/ {
        limit_req zone=ujian burst=200 nodelay;

        proxy_pass http://adzkia_app;
        include /etc/nginx/conf.d/adzkia-proxy.inc;

        # Denyut menyerah sendiri pada 8 detik (BATAS_DENYUT_MS) dan mencoba
        # lagi. Nginx tidak boleh menahannya lebih lama daripada itu —
        # permintaan yang menggantung persis yang dulu menggugurkan peserta
        # yang tidak berbuat salah.
        proxy_read_timeout 15s;
        proxy_connect_timeout 3s;
    }

    # Gerbang masuk — di sinilah tebak-sandi massal terjadi, dan tidak ada
    # peserta sah yang perlu mencoba masuk dua kali per detik.
    location = /masuk {
        limit_req zone=masuk burst=10 nodelay;
        proxy_pass http://adzkia_app;
        include /etc/nginx/conf.d/adzkia-proxy.inc;
    }

    # Ekspor nilai dan rekap pengelola memang lama. Dipisah supaya batas
    # waktunya panjang tanpa ikut melonggarkan batas waktu jalur ujian.
    location /api/admin/ {
        proxy_pass http://adzkia_app;
        include /etc/nginx/conf.d/adzkia-proxy.inc;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://adzkia_app;
        include /etc/nginx/conf.d/adzkia-proxy.inc;
    }

    location @app {
        proxy_pass http://adzkia_app;
        include /etc/nginx/conf.d/adzkia-proxy.inc;
    }
}
