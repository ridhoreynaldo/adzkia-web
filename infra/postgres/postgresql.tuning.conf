# ============================================================
# Penyetelan PostgreSQL — ADZKIA SMART
#
# Ditulis untuk VPS 4 vCPU / 8 GB RAM dengan SSD, dan untuk basis data yang
# SELURUHNYA muat di memori (di bawah 1 GB termasuk indeks). Itu mengubah
# sebagian besar keputusannya: yang mahal di sini bukan membaca disk,
# melainkan jumlah koneksi dan biaya menulis.
#
# Dipasang lewat `command:` di docker-compose.prod.yml, atau di-include dari
# postgresql.conf pada pemasangan biasa.
# ============================================================

# ------------------------------------------------------------
# KONEKSI
# ------------------------------------------------------------
#
# 200, dan sebagian besarnya TIDAK akan pernah dipakai aplikasi — PgBouncer
# dibatasi 90 (`max_db_connections`). Sisanya sengaja: psql pengelola,
# pencadangan, pemantauan, dan pekerjaan berat yang menyambung langsung.
#
# Menaikkan angka ini BUKAN cara menambah kapasitas. Tiap koneksi adalah satu
# proses dengan memorinya sendiri, dan biaya mengurusnya naik lebih cepat
# daripada manfaatnya. Kapasitas datang dari query yang lebih murah.
max_connections = 200

# ------------------------------------------------------------
# MEMORI
# ------------------------------------------------------------

# Seperempat RAM — anjuran baku, dan di sini kebetulan juga cukup untuk
# menampung seluruh basis data beserta indeksnya.
shared_buffers = 2GB

# Perkiraan cache yang tersedia termasuk cache berkas OS. Bukan alokasi;
# hanya memberi tahu perencana bahwa membaca lewat indeks itu murah.
effective_cache_size = 6GB

# Per operasi pengurutan, BUKAN per koneksi. Query jalur ujian tidak
# mengurutkan apa pun; yang butuh ini adalah rekap dan papan peringkat
# pengelola. 16 MB x beberapa pengurutan x 90 koneksi masih aman.
work_mem = 16MB

# Dipakai VACUUM dan CREATE INDEX. Lebih besar berarti pemeliharaan lebih
# cepat, dan hanya beberapa proses yang memakainya sekaligus.
maintenance_work_mem = 512MB

# ------------------------------------------------------------
# PENULISAN
# ------------------------------------------------------------
#
# Tabel terpanas di sini banyak DITULIS: `answers` menerima 160 butir per
# peserta berkali-kali, dan `attempts.denyut_at` diperbarui tiap lima detik
# per peserta. Penyetelan di bawah semuanya tentang itu.

# WAL yang lebih besar berarti titik-periksa lebih jarang, dan titik-periksa
# adalah saat PostgreSQL paling terasa tersendat.
max_wal_size = 4GB
min_wal_size = 1GB

# Menyebar penulisan titik-periksa sepanjang 90% jaraknya, alih-alih
# menumpuknya di akhir. Inilah beda antara beban yang rata dan beban yang
# tersentak tiap beberapa menit — dan sentakan di tengah ujian terasa oleh
# peserta.
checkpoint_completion_target = 0.9

# SSD: pembacaan acak nyaris semurah pembacaan berurutan. Bawaannya (4.0)
# ditulis untuk cakram berputar dan membuat perencana menghindari indeks.
random_page_cost = 1.1
effective_io_concurrency = 200

# ------------------------------------------------------------
# CATATAN — bahan mentah penyetelan
# ------------------------------------------------------------

# Query di atas 200 ms dicatat lengkap dengan teksnya. Tanpa ini, "query mana
# yang lambat" selamanya cuma tebakan.
log_min_duration_statement = 200
log_checkpoints = on
log_lock_waits = on
log_temp_files = 0
track_io_timing = on

# Statistik per pernyataan. WAJIB untuk menjawab "endpoint mana yang paling
# banyak querynya" dengan angka, bukan dengan membaca kode.
#
#     CREATE EXTENSION IF NOT EXISTS pg_stat_statements;
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.max = 10000
pg_stat_statements.track = top

# ------------------------------------------------------------
# ZONA WAKTU
# ------------------------------------------------------------
#
# Dipasang di sini DAN lewat `ALTER DATABASE adzkia SET timezone`, karena di
# belakang PgBouncer aplikasi TIDAK BOLEH mengirimkannya sebagai parameter
# pembuka sambungan. Lihat infra/pgbouncer/pgbouncer.ini butir (1).
timezone = 'Asia/Jakarta'
